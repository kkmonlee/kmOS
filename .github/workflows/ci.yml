name: kmOS kernel & QEMU integration

on:
  workflow_call:
  push:
    branches: [ master, main, feature/* ]
  pull_request:
    branches: [ master, main ]

env:
  CROSS_TARGET: i686-elf

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache cross-compiler toolchain
      uses: actions/cache@v4
      id: cache-toolchain
      with:
        path: |
          /opt/cross
          ~/.local/cross
        key: ${{ runner.os }}-cross-compiler-${{ env.CROSS_TARGET }}-v2
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo nasm qemu-system-x86 grub-pc-bin xorriso mtools
        
    - name: Build cross-compiler toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        export PREFIX="$HOME/.local/cross"
        export TARGET=$CROSS_TARGET
        export PATH="$PREFIX/bin:$PATH"
        mkdir -p $PREFIX
        
        # Download and build binutils
        cd /tmp
        wget https://ftp.gnu.org/gnu/binutils/binutils-2.40.tar.gz
        tar -xf binutils-2.40.tar.gz
        mkdir binutils-build && cd binutils-build
        ../binutils-2.40/configure --target=$TARGET --prefix="$PREFIX" --with-sysroot --disable-nls --disable-werror
        make -j$(nproc)
        make install
        
        # Download and build GCC
        cd /tmp
        wget https://ftp.gnu.org/gnu/gcc/gcc-12.2.0/gcc-12.2.0.tar.gz
        tar -xf gcc-12.2.0.tar.gz
        mkdir gcc-build && cd gcc-build
        ../gcc-12.2.0/configure --target=$TARGET --prefix="$PREFIX" --disable-nls --enable-languages=c,c++ --without-headers
        make all-gcc -j$(nproc)
        make all-target-libgcc -j$(nproc)
        make install-gcc
        make install-target-libgcc
        
    - name: Setup cross-compiler environment
      run: |
        echo "$HOME/.local/cross/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/cross/bin:$PATH"
        which i686-elf-gcc
        i686-elf-gcc --version
        
    - name: Build kernel
      run: |
        export PATH="$HOME/.local/cross/bin:$PATH"
        make clean
        make all
        
    - name: Test memory and QEMU boot
      run: make test

    - name: Test GRUB ISO boot
      run: make test-iso

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: boot-tests
        path: integration_tests/results/paging/
        retention-days: 7
