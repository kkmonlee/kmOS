name: kmOS kernel & QEMU integration

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
  push:
    branches: [ master, main, feature/* ]
  pull_request:
    branches: [ master, main ]

env:
  CROSS_TARGET: i686-elf

permissions:
  contents: read

cache-mode: none

jobs:
  prepare-source:
    name: Prepare Source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Fetch release tag
      if: ${{ inputs.release }}
      env:
        RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
      run: git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

    - name: Archive source
      run: tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/kernel-source.tar.gz" .

    - name: Upload source
      uses: actions/upload-artifact@v4
      with:
        name: kernel-source
        path: ${{ runner.temp }}/kernel-source.tar.gz
        if-no-files-found: error
        retention-days: 1

  build-toolchain:
    name: Build Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}
    cache-mode: write

    steps:
    - name: Cache cross-compiler toolchain
      if: ${{ !inputs.release }}
      uses: actions/cache@v4
      id: cache-toolchain
      with:
        path: ~/.local/cross
        key: ${{ runner.os }}-cross-compiler-${{ env.CROSS_TARGET }}-v3

    - name: Install dependencies
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo

    - name: Build cross-compiler toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        export PREFIX="$HOME/.local/cross"
        export TARGET=$CROSS_TARGET
        export PATH="$PREFIX/bin:$PATH"
        mkdir -p "$PREFIX"

        cd /tmp
        wget https://ftp.gnu.org/gnu/binutils/binutils-2.40.tar.gz
        tar -xf binutils-2.40.tar.gz
        mkdir binutils-build && cd binutils-build
        ../binutils-2.40/configure --target=$TARGET --prefix="$PREFIX" --with-sysroot --disable-nls --disable-werror
        make -j$(nproc)
        make install

        cd /tmp
        wget https://ftp.gnu.org/gnu/gcc/gcc-12.2.0/gcc-12.2.0.tar.gz
        tar -xf gcc-12.2.0.tar.gz
        mkdir gcc-build && cd gcc-build
        ../gcc-12.2.0/configure --target=$TARGET --prefix="$PREFIX" --disable-nls --enable-languages=c,c++ --without-headers
        make all-gcc -j$(nproc)
        make all-target-libgcc -j$(nproc)
        make install-gcc
        make install-target-libgcc

    - name: Archive toolchain
      run: tar -C "$HOME/.local" -czf "$RUNNER_TEMP/cross-toolchain.tar.gz" cross

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: cross-toolchain
        path: ${{ runner.temp }}/cross-toolchain.tar.gz
        if-no-files-found: error
        retention-days: 1

  build-kernel:
    name: Build Kernel
    needs: [prepare-source, build-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Download source
      uses: actions/download-artifact@v4
      with:
        name: kernel-source
        path: ${{ runner.temp }}

    - name: Extract source
      run: tar -C "$GITHUB_WORKSPACE" -xzf "$RUNNER_TEMP/kernel-source.tar.gz"

    - name: Validate release tag
      if: ${{ inputs.release }}
      env:
        RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
      run: python3 scripts/version.py --check-release "$RELEASE_TAG"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm qemu-system-x86 grub-pc-bin xorriso mtools

    - name: Download toolchain
      uses: actions/download-artifact@v4
      with:
        name: cross-toolchain
        path: ${{ runner.temp }}

    - name: Extract toolchain
      run: |
        mkdir -p "$HOME/.local"
        tar -C "$HOME/.local" -xzf "$RUNNER_TEMP/cross-toolchain.tar.gz"

    - name: Setup cross-compiler environment
      run: |
        echo "$HOME/.local/cross/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/cross/bin:$PATH"
        which i686-elf-gcc
        i686-elf-gcc --version
        
    - name: Build kernel
      run: |
        export PATH="$HOME/.local/cross/bin:$PATH"
        make clean
        make all
        
    - name: Test memory and QEMU boot
      run: make test

    - name: Test GRUB ISO boot
      run: make test-iso

    - name: Package release
      if: ${{ inputs.release }}
      run: python3 scripts/version.py --package dist

    - name: Upload release files
      if: ${{ inputs.release }}
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: dist/
        if-no-files-found: error
        retention-days: 7

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: boot-tests
        path: integration_tests/results/paging/
        retention-days: 7
