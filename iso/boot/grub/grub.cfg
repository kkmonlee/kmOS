set timeout=0
set default=0

menuentry "kmOS" {
    multiboot /boot/kernel.elf user
    module /boot/init.elf init
    module /boot/hello.elf hello
    module /boot/cat.elf cat
    module /boot/sh.elf sh
    module /boot/ls.elf ls
    module /boot/mkdir.elf mkdir
    module /boot/rmdir.elf rmdir
    module /boot/rm.elf rm
    module /boot/cp.elf cp
    module /boot/mv.elf mv
    boot
}
